<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 13 · الـSEO ببساطة</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  #sb{left:110px;right:110px;top:630px;height:96px;border-radius:48px;display:flex;align-items:center;gap:20px;padding:0 34px;font-size:32px}
  #sb .ph{color:var(--muted)}
  .step{position:absolute;width:86px;background:#E6E5DD;border-top:4px solid #C9C7BD}
  .step span{position:absolute;left:0;right:0;top:10px;text-align:center;font:600 24px var(--mono);color:var(--muted)}
  #site{left:0;top:0;width:90px;height:66px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(20,32,27,.25)}
  #site div{width:22px;height:33px}
  #win{left:830px;top:740px;background:var(--ink);color:var(--paper);font-size:30px}
  .why{position:absolute;left:90px;display:flex}
  .why .chip{background:var(--card);border-color:var(--line);color:var(--ink);font-size:30px}
  .why .chip svg{flex:none}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:370px">من الصفحة <span class="mono">10</span>…<br><span class="g">للنتيجة الأولى</span></div>
  <div class="abs cx h-l" id="q2" style="top:370px">الظهور في البحث<br><span class="g">مو حظ… شغل.</span></div>
  <div class="abs card" id="sb"><span class="ic"></span><span id="qt"></span><span class="ph" id="cur">|</span></div>
  <div id="stairs"></div>
  <div class="abs" id="site"><div></div></div>
  <div class="abs chip" id="win">#1</div>
  <div class="why" id="y1" style="top:790px"><span class="chip"></span></div>
  <div class="why" id="y2" style="top:880px"><span class="chip"></span></div>
  <div class="why" id="y3" style="top:970px"><span class="chip"></span></div>
  <div class="why" id="y4" style="top:1060px"><span class="chip"></span></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, cue, hook, icon, MARK, $, $$, E} = S;
S.setup({day: 13, dur: 16.2, mood: 'drive', bg: 'paper'});
$('#sb .ic').innerHTML = icon('search', 40, '#3F7A62', 2.2);
$('#site div').innerHTML = MARK('#F1F0EA', 16);
[['zap', 'سرعة تحميل'], ['file', 'محتوى مفيد'], ['layers', 'بنية صحيحة'], ['phone', 'تجربة جوال']].forEach(([n, l], i) => $(`#y${i + 1} .chip`).innerHTML = icon(n, 30, '#3F7A62') + l);

// staircase: page 10 at the bottom left, #1 top right
const st = $('#stairs'), pos = [];
for (let i = 0; i < 10; i++){
  const x = 110 + i * 86, y = 1420 - i * 62;
  st.insertAdjacentHTML('beforeend', `<div class="step" id="s${i}" style="left:${x}px;top:${y}px;height:${1500 - y}px"><span>${10 - i}</span></div>`);
  pos.push([x - 2, y - 70]);
}
say('#q', .25, 10.0, {st: .12}); cue(.25, 'swish');
inOut('#sb', .6, 10.0, {dy: 30});
const query = 'تصميم مواقع في مسقط';
hook(t => { const n = Math.max(0, Math.min(query.length, Math.floor((t - .9) / .06))); $('#qt').textContent = query.slice(0, n); $('#cur').style.opacity = Math.floor(t * 2.5) % 2 ? 1 : 0; });
cue(.9, 'type', {n: 16, gap: .06});
$$('.step').forEach((s, i) => K(s, [[1.3 + i * .06, {transform: 'scaleY(0)', opacity: 0}, E.OUT], [1.7 + i * .06, {transform: 'scaleY(1)', opacity: 1}], [12.9, {transform: 'scaleY(1)', opacity: 1}], [13.1, {transform: 'scaleY(1)', opacity: 0}]]));
$$('.step').forEach(s => s.style.transformOrigin = 'bottom');
cue(1.3, 'riser', {d: .8, v: .6});

// the site hops up one step at a time
const hop = [[2.2, {transform: `translate(${pos[0][0]}px,${pos[0][1]}px)`, opacity: 0}, E.OUT], [2.5, {transform: `translate(${pos[0][0]}px,${pos[0][1]}px)`, opacity: 1}]];
for (let i = 1; i < 10; i++){
  const t = 2.6 + i * .52, [x, y] = pos[i], [px, py] = pos[i - 1];
  hop.push([t - .26, {transform: `translate(${(x + px) / 2}px,${Math.min(y, py) - 70}px)`, opacity: 1}, 'cubic-bezier(.3,0,.7,1)'], [t, {transform: `translate(${x}px,${y}px)`, opacity: 1}, E.OUT]);
  cue(t, 'thud', {v: .45}); cue(t - .05, 'pop2', {f: 300 + i * 45, v: .5});
}
K('#site', [...hop, [12.9, {transform: `translate(${pos[9][0]}px,${pos[9][1]}px)`, opacity: 1}], [13.1, {transform: `translate(${pos[9][0]}px,${pos[9][1]}px)`, opacity: 0}]]);
K('#s9', [[7.3, {backgroundColor: '#E6E5DD'}], [7.6, {backgroundColor: '#CFE3D8'}]]);
pop('#win', 7.6, 12.9); cue(7.6, 'chime');
// what gets you there
[8.2, 8.5, 8.8, 9.1].forEach((t, i) => { inOut(`#y${i + 1}`, t, 12.9, {dx: 80, dy: 0, d: .45}); cue(t, 'tick', {v: 1.4}); });
say('#q2', 10.3, 12.9, {st: .12}); cue(10.3, 'swish');
S.start();
</script></body></html>
