<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — مقدمة · من أنا</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  /* silent on purpose — a Quran recitation is added over it, so the pacing is slow and calm */
  .ln{position:absolute;left:80px;right:80px;text-align:center}
  #mk0{left:470px;top:700px;width:140px;height:210px}
  #ic{left:440px;top:640px;width:200px;height:200px;border-radius:50%;border:2px solid var(--ink-2);display:flex;align-items:center;justify-content:center}
  #ic > div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .lock{position:absolute;left:0;right:0;top:700px;display:flex;justify-content:center;align-items:center;gap:36px;direction:ltr}
  .lock .wm{font-family:var(--lat);font-weight:600;font-size:150px;letter-spacing:-.045em;line-height:1}
  .lock .mk{width:100px;height:150px}
  #dots{left:200px;top:880px;width:680px;display:grid;grid-template-columns:repeat(6,1fr);gap:22px;justify-items:center}
  #dots i{width:64px;height:64px;border-radius:50%;border:2px solid var(--ink-2);display:flex;align-items:center;justify-content:center;font:500 20px var(--mono);font-style:normal;color:var(--muted)}
  .soft{color:#9AA39D}
  #sky{left:0;right:0;top:560px;height:200px}
  #sun,#moon{position:absolute;left:50%;top:0;margin-left:-45px}
  #glow{left:190px;top:620px;width:700px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(95,168,138,.18),rgba(95,168,138,0));opacity:0}
  #books{left:390px;top:760px;width:300px;height:219px}
  #lap{left:360px;top:760px;width:360px;height:252px}
  #books svg,#lap svg{width:100%;height:100%}
  #lap .cl{transform-box:fill-box;transform-origin:left}
</style></head><body>
<div id="stage">
  <!-- 1 -->
  <div class="abs" id="mk0"></div>
  <div class="ln h-l" id="a1" style="top:1000px">كل رحلة…<br><span class="gl">تبدأ بخطوة.</span></div>
  <!-- 2: by day a student, by night a builder -->
  <div class="abs" id="sky"><div id="sun"></div><div id="moon"></div></div>
  <div class="abs" id="glow"></div>
  <div class="abs" id="books"><svg viewBox="0 0 260 190" fill="none" stroke="#C9C7BD" stroke-width="4" stroke-linejoin="round">
    <rect class="bk" x="30" y="128" width="200" height="44" rx="6"/><path class="bk" d="M54 128v44"/>
    <rect class="bk" x="48" y="84" width="170" height="44" rx="6"/><path class="bk" d="M196 84v44"/>
    <rect class="bk" x="40" y="40" width="186" height="44" rx="6"/><path class="bk" d="M64 40v44M84 62h90"/></svg></div>
  <div class="abs" id="lap"><svg viewBox="0 0 300 210" fill="none" stroke="#5FA88A" stroke-width="4" stroke-linejoin="round">
    <rect x="40" y="10" width="220" height="150" rx="10"/><path d="M14 176h272l-14 18H28z"/>
    <g stroke="none"><rect class="cl" x="62" y="34" width="70" height="9" rx="4" fill="#5FA88A"/><rect class="cl" x="76" y="56" width="120" height="9" rx="4" fill="#C9C7BD"/>
    <rect class="cl" x="76" y="78" width="90" height="9" rx="4" fill="#C9C7BD"/><rect class="cl" x="90" y="100" width="130" height="9" rx="4" fill="#5FA88A"/>
    <rect class="cl" x="76" y="122" width="60" height="9" rx="4" fill="#C9C7BD"/><rect id="cur" x="142" y="120" width="5" height="14" fill="#F1F0EA"/></g></svg></div>
  <div class="ln h-l" id="b1" style="top:1060px">بالنهار… <span class="soft">طالب.</span></div>
  <div class="ln h-l" id="b2" style="top:1060px">وبالليل… <span class="gl">أبني حلمي.</span></div>
  <!-- 3 -->
  <div class="ln h-m" id="c1" style="top:520px">وعندي مشروع…</div>
  <div class="lock" id="lk"><div class="wm" id="wm">Solva</div><div class="mk" id="mk1"></div></div>
  <div class="ln t-l soft" id="c2" style="top:930px">نبني مواقع تعمل،<br>لا مواقع تُعجب فقط.</div>
  <!-- 4 -->
  <div class="ln h-l" id="d1" style="top:520px">هدفنا:</div>
  <div class="ln h-m" id="d2" style="top:680px"><span class="gl mono">30</span> مقطع في <span class="gl mono">30</span> يوم.</div>
  <div class="abs" id="dots"></div>
  <!-- 5 -->
  <div class="ln h-l" id="e1" style="top:780px">تابعوا الرحلة<br><span class="gl">معنا.</span></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, fade, draw, icon, MARK, $, $$, E} = S;
S.setup({day: 0, dur: 30.0, silent: true, end: {cta: 'تابعنا', line: 'من اليوم… <b>٣٠ يوم</b> من البناء.', next: 'DAY 01 · tomorrow'}});
const SLOW = 'cubic-bezier(.33,0,.15,1)';
// gentle in/out: long fades, small drift, a touch of blur — nothing that fights the recitation
const soft = (el, a, b, o = {}) => inOut(el, a, b, {dy: 24, blur: 8, d: 1.1, od: .7, ez: SLOW, ...o});

// 1 — the first step
$('#mk0').innerHTML = MARK('#5FA88A', 11);
$$('#mk0 path').forEach((p, i) => draw(p, .6 + i * .9, 1.8 + i * .9, SLOW));
fade('#mk0', .4, 4.6, .8);
soft('#a1', 2.0, 4.8);

// 2 — by day a student (sun, books), by night a builder (moon, laptop, code)
$('#sun').innerHTML = icon('sun', 90, '#C9C7BD', 1.4);
$('#moon').innerHTML = icon('moon', 84, '#5FA88A', 1.4);
K('#sun', [[5.4, {opacity: 0, transform: 'translateY(40px)'}, SLOW], [6.6, {opacity: 1, transform: 'translateY(0)'}], [8.5, {opacity: 1, transform: 'translateY(0)'}, SLOW], [9.6, {opacity: 0, transform: 'translateY(60px)'}]]);
K('#moon', [[8.9, {opacity: 0, transform: 'translateY(-50px)'}, SLOW], [10.1, {opacity: 1, transform: 'translateY(0)'}], [12.0, {opacity: 1, transform: 'translateY(0)'}, E.IN], [12.6, {opacity: 0, transform: 'translateY(0)'}]]);
$$('#books .bk').forEach((b, i) => draw(b, 5.8 + i * .2, 7.0 + i * .2, SLOW));
K('#books', [[8.5, {opacity: 1, filter: 'blur(0px)'}, SLOW], [9.4, {opacity: 0, filter: 'blur(8px)'}]]);
soft('#b1', 6.4, 8.6);
soft('#lap', 9.0, 12.1, {dy: 30});
K('#glow', [[9.4, {opacity: 0}, SLOW], [10.6, {opacity: 1}], [12.0, {opacity: 1}, E.IN], [12.6, {opacity: 0}]]);
$$('#lap .cl').forEach((c, i) => K(c, [[10.0 + i * .35, {transform: 'scaleX(0)'}, SLOW], [10.5 + i * .35, {transform: 'scaleX(1)'}]]));
K('#cur', [...Array(12)].map((_, k) => [10 + k * .4, {opacity: k % 2 ? 0 : 1}, 'steps(1,end)']));
soft('#b2', 9.6, 12.1);

// 3 — the project
soft('#c1', 12.8, 17.6);
$('#mk1').innerHTML = MARK('#5FA88A', 13);
soft('#wm', 13.6, 17.7, {dy: 0, blur: 12});
$$('#mk1 path').forEach((p, i) => draw(p, 14.0 + i * .6, 15.0 + i * .6, SLOW));
K('#mk1', [[17.7, {opacity: 1}, E.IN], [18.4, {opacity: 0}]]);
soft('#c2', 15.2, 17.8);

// 4 — the goal: thirty days fill one by one
const dots = $('#dots');
for (let n = 1; n <= 30; n++) dots.insertAdjacentHTML('beforeend', `<i id="o${n}">${String(n).padStart(2, '0')}</i>`);
soft('#d1', 18.6, 23.4);
soft('#d2', 19.2, 23.5);
fade('#dots', 19.6, 23.4, .8);
for (let n = 1; n <= 30; n++){
  const t = 20.2 + n * .08;
  K(`#o${n}`, [[t, {backgroundColor: 'rgba(95,168,138,0)', borderColor: '#3A423E', color: '#7C837E'}, SLOW], [t + .5, {backgroundColor: 'rgba(95,168,138,1)', borderColor: '#5FA88A', color: '#14201B'}]]);
}

// 5 — invitation
soft('#e1', 24.0, null);
S.start();
// slower outro reveal for this calm piece: keep the engine's outro but no sound is rendered
</script></body></html>
