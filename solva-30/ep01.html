<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 01 · من نحن</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  #mk{left:440px;top:800px;width:200px;height:300px}
  #mk svg{width:100%;height:100%;overflow:visible}
  .svc{width:290px;height:290px;flex-direction:column;gap:26px}
  .svc .lbl{font-weight:600;font-size:40px}
  .svc .en{font-size:22px;color:var(--muted)}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:400px">من هي <span class="gl">سولفا</span>؟</div>
  <div class="abs" id="mk"></div>
  <div class="abs card-d flex svc" id="c1" style="left:575px;top:655px"><div class="ic"></div><div class="lbl">تصميم</div><div class="en mono">UI / UX</div></div>
  <div class="abs card-d flex svc" id="c2" style="left:215px;top:655px"><div class="ic"></div><div class="lbl">برمجة</div><div class="en mono">DEV</div></div>
  <div class="abs card-d flex svc" id="c3" style="left:575px;top:975px"><div class="ic"></div><div class="lbl">متاجر</div><div class="en mono">E-COMMERCE</div></div>
  <div class="abs card-d flex svc" id="c4" style="left:215px;top:975px"><div class="ic"></div><div class="lbl">ظهور في البحث</div><div class="en mono">SEO</div></div>
  <div class="abs cx t-l" id="tg" style="top:1340px;padding:0 120px">استوديو رقمي في عُمان يبني المواقع والواجهات والأنظمة.</div>
  <div class="abs cx h-m" id="tg2" style="top:1330px">نبدأ من <span class="gl">المشكلة</span>،<br>لا من الشاشة.</div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, draw, cue, icon, MARK, $, $$, E} = S;
S.setup({day: 1, dur: 14.2, mood: 'warm'});

$('#mk').innerHTML = MARK('#5FA88A', 13);
['pen', 'code', 'bag', 'search'].forEach((n, i) => $(`#c${i + 1} .ic`).innerHTML = icon(n, 96, '#5FA88A', 1.8));

// hook
say('#q', .3, 10.6);
cue(.3, 'swish');

// the mark draws itself
const [a1, a2] = $$('#mk path');
draw(a1, .7, 1.3); draw(a2, 1.0, 1.6);
cue(.7, 'zip'); cue(1.0, 'zip');

// ...then splits apart into the four services
K(a1, [[2.3, {transform: 'translate(0,0) rotate(0deg)', opacity: 1}, E.INOUT], [2.8, {transform: 'translate(60px,-80px) rotate(-40deg)', opacity: 0}],
       [7.1, {transform: 'translate(60px,-80px) rotate(-40deg)', opacity: 0}, E.OUT], [7.7, {transform: 'translate(0,0) rotate(0deg)', opacity: 1}]]);
K(a2, [[2.3, {transform: 'translate(0,0) rotate(0deg)', opacity: 1}, E.INOUT], [2.8, {transform: 'translate(-60px,80px) rotate(-40deg)', opacity: 0}],
       [7.1, {transform: 'translate(-60px,80px) rotate(-40deg)', opacity: 0}, E.OUT], [7.7, {transform: 'translate(0,0) rotate(0deg)', opacity: 1}]]);
cue(2.3, 'whoosh');

const centers = [[720, 800], [360, 800], [720, 1120], [360, 1120]];
centers.forEach(([x, y], i) => {
  const dx = 540 - x, dy = 950 - y, a = 2.45 + i * .12, b = 6.8 + (3 - i) * .06;
  K(`#c${i + 1}`, [
    [a, {transform: `translate(${dx}px,${dy}px) scale(.2) rotate(-12deg)`, opacity: 0}, E.BACK],
    [a + .6, {transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1}],
    [b, {transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1}, E.IN],
    [b + .45, {transform: `translate(${dx}px,${dy}px) scale(.2) rotate(12deg)`, opacity: 0}],
  ]);
  cue(a + .1, 'pop', {f: 520 + i * 90});
  // each service gets a moment in the spotlight
  const h = 3.6 + i * .7;
  K(`#c${i + 1}`, [[h, {borderColor: '#3A423E', backgroundColor: '#223029'}], [h + .25, {borderColor: '#5FA88A', backgroundColor: '#1E3A2F'}],
                   [h + .7, {borderColor: '#5FA88A', backgroundColor: '#1E3A2F'}], [h + 1, {borderColor: '#3A423E', backgroundColor: '#223029'}]]);
  cue(h, 'tick', {v: 1.4});
});

inOut('#tg', 3.2, 6.6, {dy: 30});
cue(6.8, 'swoop');
K('#mk', [[7.65, {transform: 'scale(1)'}, E.OUT], [7.8, {transform: 'scale(1.12)'}, E.BACK], [8.2, {transform: 'scale(1)'}]]);
cue(7.65, 'impact', {v: .6});
say('#tg2', 8.1, 10.7, {st: .1});
S.start();
</script></body></html>
