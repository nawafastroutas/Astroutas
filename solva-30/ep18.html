<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 18 · قاموس المبرمجين</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  .cw{position:absolute;left:150px;top:640px;width:780px;height:660px;perspective:2200px}
  .flip{position:absolute;inset:0;transform-style:preserve-3d}
  .face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:60px;text-align:center}
  .fr{background:var(--ink-4);border:2px solid var(--ink-2)}
  .fr .term{font:600 150px var(--lat);letter-spacing:-.03em;color:var(--paper);line-height:1;direction:ltr}
  .fr .ph{font:400 34px var(--mono);color:var(--muted);direction:ltr}
  .bk{background:var(--paper);color:var(--ink);transform:rotateY(180deg)}
  .bk .lab{color:var(--green)}
  .bk .tx{font-weight:700;font-size:52px;line-height:1.45}
  .bk .tx small{display:block;font-weight:500;font-size:40px;color:var(--ink-3);margin-top:10px}
  .idx{position:absolute;left:0;right:0;top:1350px;text-align:center}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:370px">قاموس <span class="gl">المبرمجين</span> 📖</div>
  <div id="cards"></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, cue, $, $$, E} = S;
S.setup({day: 18, dur: 16.6, mood: 'playful'});

const W = [
  ['Bug', '/bʌɡ/', 'مشكلة صغيرة… تختفي وأنت تدوّرها،', 'وتطلع قدّام العميل بالضبط 🙃'],
  ['Cache', '/kæʃ/', 'المتصفح حافظ النسخة القديمة…', 'حدّث الصفحة وبتشوف التعديل 🔄'],
  ['Deploy', '/dɪˈplɔɪ/', 'لحظة الحقيقة: نرفع الموقع للنت…', 'ونحبس أنفاسنا 😬'],
];
const box = $('#cards');
W.forEach(([t, ph, a, b], i) => box.insertAdjacentHTML('beforeend', `<div class="cw" id="c${i}"><div class="flip">
  <div class="face fr"><div class="term">${t}</div><div class="ph">${ph}</div></div>
  <div class="face bk"><div class="lab">TRANSLATION · ${t.toUpperCase()}</div><div class="tx">${a}<small>${b}</small></div></div></div></div>
  <div class="idx lab" id="i${i}">${String(i + 1).padStart(2, '0')} / 03</div>`));

say('#q', .2, 13.5, {st: .14}); cue(.2, 'swish');
W.forEach((_, i) => {
  const a = .9 + i * 4.2, last = i === 2;
  K(`#c${i}`, [[a, {opacity: 0, transform: 'translateY(120px) rotate(4deg) scale(.9)'}, E.OUT], [a + .5, {opacity: 1, transform: 'translateY(0) rotate(0deg) scale(1)'}],
               [a + 3.9, {opacity: 1, transform: 'translateX(0) rotate(0deg)'}, E.IN], [a + 4.3, {opacity: 0, transform: last ? 'translateX(0) scale(.9)' : 'translateX(-900px) rotate(-12deg)'}]]);
  K($(`#c${i} .flip`), [[a + 1.4, {transform: 'rotateY(0deg)'}, 'cubic-bezier(.5,0,.3,1.3)'], [a + 2.0, {transform: 'rotateY(180deg)'}]]);
  fade(`#i${i}`, a + .2, a + 3.9, .3);
  cue(a, 'whoosh', {v: .7}); cue(a + .35, 'type', {n: 5, gap: .05});
  cue(a + 1.4, 'flip'); cue(a + 2.1, last ? 'riser' : 'boing', {d: .8});
  if (!last) cue(a + 3.9, 'swoop');
});
S.start();
</script></body></html>
