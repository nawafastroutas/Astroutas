<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 16 · خمّن النشاط</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  .rd-l{position:absolute;left:0;right:0;top:560px;text-align:center;font-family:var(--mono);font-size:26px;color:var(--muted);letter-spacing:.1em}
  .sw{position:absolute;top:640px;width:150px;height:150px;border-radius:50%;border:4px solid rgba(255,255,255,.15)}
  .fs{position:absolute;left:190px;right:190px;top:840px;height:200px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:40px}
  .fs .aa{font-size:130px;line-height:1}
  .fs .ar{font-size:70px}
  .ic{position:absolute;left:430px;top:1090px;width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .ans{position:absolute;left:0;right:0;top:1360px;display:flex;justify-content:center}
  .ans .chip{font-size:48px;padding:16px 40px;background:var(--green-l);color:var(--ink);border:0}
  #cd{left:430px;top:1090px;width:220px;height:220px;display:flex;align-items:center;justify-content:center;font:600 120px var(--mono);color:var(--paper);text-shadow:0 4px 20px rgba(0,0,0,.6)}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:370px">خمّن <span class="gl">النشاط</span> 🤔</div>
  <div id="rounds"></div>
  <div class="abs" id="cd"></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, cue, hook, icon, $, $$, E} = S;
S.setup({day: 16, dur: 18.2, mood: 'playful'});

const R = [
  {cols: ['#2B1D14', '#6F4E37', '#C8A27A', '#F3E9DC'], card: '#F3E9DC', ink: '#2B1D14', aa: "font-family:'DejaVu Serif',serif;font-style:italic", ar: 'font-weight:300', ic: 'cup', icBg: '#6F4E37', icC: '#F3E9DC', ans: 'مقهى ☕'},
  {cols: ['#1E6FB8', '#7FB7E3', '#E8F2FB', '#FFFFFF'], card: '#FFFFFF', ink: '#1E6FB8', aa: 'font-family:var(--lat);font-weight:500', ar: 'font-weight:500', ic: 'tooth', icBg: '#E8F2FB', icC: '#1E6FB8', ans: 'عيادة أسنان 🦷'},
  {cols: ['#111111', '#3B2F2A', '#C9A45C', '#F5EFE6'], card: '#111111', ink: '#C9A45C', aa: "font-family:'DejaVu Serif',serif;font-weight:300;letter-spacing:.05em", ar: 'font-weight:300', ic: 'drop', icBg: '#111111', icC: '#C9A45C', ans: 'اكتب تخمينك في التعليقات 👇'},
];
const box = $('#rounds');
R.forEach((r, k) => {
  box.insertAdjacentHTML('beforeend', `<div id="r${k}">
    <div class="rd-l">ROUND ${k + 1}/3</div>
    ${r.cols.map((c, i) => `<div class="sw" style="left:${150 + i * 200}px;background:${c}"></div>`).join('')}
    <div class="fs" style="background:${r.card};color:${r.ink}"><span class="aa" style="${r.aa}">Aa</span><span class="ar" style="${r.ar}">أبجد</span></div>
    <div class="ic" style="background:${r.icBg};border:4px solid ${r.icC}">${icon(r.ic, 120, r.icC, 1.6)}</div>
    <div class="ans"><span class="chip">${r.ans}</span></div></div>`);
});

say('#q', .2, 15.0, {st: .14}); cue(.2, 'swish');
const start = [.8, 5.6, 10.4], len = 4.6;
let cdTimes = [];
R.forEach((r, k) => {
  const a = start[k], end = a + len - .3, root = $(`#r${k}`), last = k === 2;
  fade($('.rd-l', root), a, last ? 14.8 : end, .3);
  $$('.sw', root).forEach((s, i) => { pop(s, a + .2 + i * .22, last ? 14.8 : end); cue(a + .2 + i * .22, 'pop', {f: 500 + i * 90}); });
  inOut($('.fs', root), a + 1.2, last ? 14.8 : end, {dy: 40}); cue(a + 1.2, 'swish');
  const ic = $('.ic', root);
  K(ic, [[a + 1.8, {opacity: 0, filter: 'blur(24px)', transform: 'scale(.6)'}, E.OUT], [a + 2.2, {opacity: 1, filter: 'blur(24px)', transform: 'scale(1)'}, E.INOUT],
         [a + 3.4, {opacity: 1, filter: 'blur(0px)', transform: 'scale(1)'}], [last ? 14.8 : end, {opacity: 1, filter: 'blur(0px)', transform: 'scale(1)'}, E.IN], [(last ? 14.8 : end) + .3, {opacity: 0, filter: 'blur(0px)', transform: 'scale(.8)'}]]);
  cdTimes.push(a + 2.2);
  [0, .4, .8].forEach(d => cue(a + 2.2 + d, 'beep', {f: 700}));
  pop($('.ans', root), a + 3.5, last ? 14.8 : end);
  cue(a + 3.5, last ? 'boing' : 'right'); if (!last) cue(a + 3.55, 'chime', {v: .6});
});
hook(t => { const c = cdTimes.find(c => t >= c && t < c + 1.2); $('#cd').textContent = c == null ? '' : String(3 - Math.floor((t - c) / .4)); });
S.start();
</script></body></html>
