<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 21 · لو موقعك إنسان</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  .who{position:absolute;top:640px}
  .nm{position:absolute;top:570px;width:540px;text-align:center;font-weight:700;font-size:40px}
  #zz{left:880px;top:640px;padding:10px 20px;border-radius:18px;background:var(--ink-4);border:2px solid var(--ink-2);font:600 26px var(--mono);color:var(--muted)}
  .row{position:absolute;left:60px;right:60px;height:78px;display:grid;grid-template-columns:1fr 150px 1fr;align-items:center}
  .row .k{text-align:center;font-size:24px;color:var(--muted);font-family:var(--mono)}
  .row .a,.row .b{display:flex;align-items:center;gap:12px;font-weight:600;font-size:32px}
  .row .a{justify-content:flex-start}
  .row .b{justify-content:flex-end;color:var(--muted)}
  .row{border-bottom:1.5px solid var(--ink-2)}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:370px">لو موقعك… <span class="gl">إنسان؟</span></div>
  <div class="abs cx h-l" id="q2" style="top:370px">أي واحد <span class="gl">يمثّل موقعك؟</span> 👀</div>
  <div class="nm" id="nOld" style="right:0">الموقع القديم</div>
  <div class="nm gl" id="nNew" style="left:0">الموقع الحديث</div>
  <div class="who" id="old" style="right:175px"></div>
  <div class="who" id="neo" style="left:175px"></div>
  <div class="abs" id="zz">loading…</div>
  <div id="rows"></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, cue, icon, person, mood, $, $$, E} = S;
S.setup({day: 21, dur: 16.6, mood: 'playful'});
$('#old').innerHTML = person({w: 190, old: true, shirt: '#8E8A84', pants: '#4A524D'});
$('#neo').innerHTML = person({w: 190, shirt: '#5FA88A'});

const RW = [['SPEED', 'يرد بثانية', 'ياخذ وقته…'], ['MOBILE', 'مرتاح على الجوال', 'ما يعرف الجوال'], ['LOOK', 'مرتّب وأنيق', 'لبسه من 2010'], ['REPLY', 'يرد على العملاء', 'ما يرد أبدًا']];
const box = $('#rows');
RW.forEach(([k, a, b], i) => box.insertAdjacentHTML('beforeend', `<div class="row" id="w${i}" style="top:${1100 + i * 92}px">
  <div class="b">${b} ${icon('x', 30, '#C2654F', 2.6)}</div><div class="k">${k}</div><div class="a">${icon('check', 30, '#5FA88A', 2.6)} ${a}</div></div>`));
// grid is RTL: first column (old) sits on the right, matching the characters

say('#q', .2, 10.9, {st: .14}); cue(.2, 'swish');
inOut('#old', .7, 13.4, {dy: 50}); inOut('#neo', .9, 13.4, {dy: 50});
inOut('#nOld', 1.0, 13.4, {dy: 20}); inOut('#nNew', 1.2, 13.4, {dy: 20});
// old site: yawns, sags, "loading…"
mood('#old', .1, 'flat');
K($('#old .hd'), [[1.8, {transform: 'rotate(0deg)'}, E.INOUT], [2.4, {transform: 'rotate(12deg) translateY(6px)'}], [4.0, {transform: 'rotate(12deg) translateY(6px)'}, E.INOUT], [4.6, {transform: 'rotate(0deg)'}]]);
cue(1.9, 'yawn');
pop('#zz', 2.2, 4.4, {s: .5}); cue(2.2, 'bubble', {f: 300});
K($('#old svg'), [...Array(8)].map((_, k) => [5 + k * .9, {transform: `translateY(${k % 2 ? 4 : 0}px)`}, E.INOUT]));
// new site: waves and hops
K($('#neo .arm-l'), [[1.6, {transform: 'rotate(8deg)'}, E.INOUT], [1.85, {transform: 'rotate(150deg)'}], [2.05, {transform: 'rotate(125deg)'}], [2.25, {transform: 'rotate(150deg)'}], [2.45, {transform: 'rotate(125deg)'}], [2.8, {transform: 'rotate(8deg)'}]]);
K($('#neo svg'), [[3.0, {transform: 'translateY(0)'}, 'cubic-bezier(.2,.8,.4,1)'], [3.25, {transform: 'translateY(-28px)'}, 'cubic-bezier(.6,0,.8,.2)'], [3.5, {transform: 'translateY(0)'}]]);
cue(1.6, 'zip'); cue(3.0, 'boing');
// the comparison
RW.forEach((_, i) => {
  const t = 4.6 + i * 1.3, r = $(`#w${i}`);
  fade(r, t, 10.9, .3);
  inOut($('.b', r), t + .1, null, {dx: 60, dy: 0}); inOut($('.a', r), t + .5, null, {dx: -60, dy: 0});
  cue(t + .1, 'wrong', {v: .6}); cue(t + .5, 'right', {v: .7});
});
say('#q2', 11.2, 13.4, {st: .14}); cue(11.2, 'swish');
K($('#neo svg'), [[11.6, {transform: 'translateY(0)'}, 'cubic-bezier(.2,.8,.4,1)'], [11.85, {transform: 'translateY(-24px)'}, 'cubic-bezier(.6,0,.8,.2)'], [12.1, {transform: 'translateY(0)'}]], {add: true});
S.start();
</script></body></html>
