<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 20 · خرافة أم حقيقة</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  .cw{position:absolute;left:150px;top:620px;width:780px;height:700px;perspective:2200px}
  .flip{position:absolute;inset:0;transform-style:preserve-3d}
  .face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:70px;text-align:center}
  .fr{background:var(--card);border:2px solid var(--line)}
  .fr .qq{font:500 150px var(--lat);color:var(--stone);line-height:.6;height:70px}
  .fr .st{font-weight:700;font-size:66px;line-height:1.35}
  .fr .lab{font-size:26px}
  .bk{background:var(--ink);color:var(--paper);transform:rotateY(180deg)}
  .bk .tx{font-weight:600;font-size:48px;line-height:1.55}
  .stamp{position:absolute;top:60px;left:50%;padding:10px 34px;border:6px solid;border-radius:10px;font-weight:700;font-size:54px;transform:translateX(-50%) rotate(-8deg);opacity:0}
  .idx{position:absolute;left:0;right:0;top:1370px;text-align:center}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:370px">خرافة… أم <span class="g">حقيقة؟</span></div>
  <div id="cards"></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, cue, $, $$, E} = S;
S.setup({day: 20, dur: 17.0, mood: 'playful', bg: 'paper'});

const M = [
  ['"الموقع غالي… ومو لي."', 'خرافة', '#C2654F', 'التكلفة حسب احتياجك،<br>وفيه بدايات بسيطة <span class="gl">تكبر معك.</span>'],
  ['"أقدر أسويه بنفسي بسهولة."', 'نص حقيقة', '#D9A441', 'الأدوات سهلة… لكن <span class="gl">السرعة والظهور والتجربة</span> تحتاج خبرة.'],
  ['"عندي إنستقرام، ما أحتاج موقع."', 'خرافة', '#C2654F', 'الموقع يثبت <span class="gl">مصداقيتك</span><br>ويطلعك في نتائج البحث.'],
];
const box = $('#cards');
M.forEach(([st, v, c, tx], i) => box.insertAdjacentHTML('beforeend', `<div class="cw" id="c${i}"><div class="flip">
  <div class="face fr"><div class="qq">“</div><div class="st">${st}</div><div class="lab">MYTH OR FACT?</div></div>
  <div class="face bk"><div class="tx">${tx}</div><div class="stamp" style="color:${c};border-color:${c}">${v}</div></div></div></div>
  <div class="idx lab" id="i${i}">${String(i + 1).padStart(2, '0')} / 03</div>`));

say('#q', .2, 13.8, {st: .14}); cue(.2, 'swish');
M.forEach((_, i) => {
  const a = .9 + i * 4.3, last = i === 2;
  K(`#c${i}`, [[a, {opacity: 0, transform: 'translateY(120px) rotate(-3deg) scale(.9)'}, E.OUT], [a + .5, {opacity: 1, transform: 'translateY(0) rotate(0deg) scale(1)'}],
               [a + 4.0, {opacity: 1, transform: 'translateX(0) rotate(0deg)'}, E.IN], [a + 4.35, {opacity: 0, transform: last ? 'translateX(0) scale(.9)' : 'translateX(900px) rotate(12deg)'}]]);
  K($(`#c${i} .flip`), [[a + 1.6, {transform: 'rotateY(0deg)'}, 'cubic-bezier(.5,0,.3,1.3)'], [a + 2.2, {transform: 'rotateY(-180deg)'}]]);
  K($(`#c${i} .stamp`), [[a + 2.4, {opacity: 0, transform: 'translateX(-50%) rotate(-8deg) scale(2.2)'}, E.IN], [a + 2.6, {opacity: 1, transform: 'translateX(-50%) rotate(-8deg) scale(1)'}]]);
  fade(`#i${i}`, a + .2, a + 4.0, .3);
  cue(a, 'whoosh', {v: .7}); cue(a + 1.6, 'flip'); cue(a + 2.55, 'stamp'); cue(a + 2.6, i === 1 ? 'boing' : 'wrong', {v: .7});
  if (!last) cue(a + 4.0, 'swoop');
});
S.start();
</script></body></html>
