<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solva — Day 28 · عرض خاص</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="engine.css">
<style>
  #gift{left:470px;top:560px;width:140px;height:140px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center}
  #card{left:90px;right:90px;top:740px;padding:44px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  #card .t{font-size:30px;color:var(--muted);font-family:var(--mono)}
  #card .o{font-weight:700;font-size:74px;line-height:1.25}
  #card .n{font-size:30px;color:var(--ink-3)}
  #cd{left:0;right:0;top:1160px;display:flex;justify-content:center;gap:16px;direction:ltr}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .u b{width:170px;height:150px;border-radius:8px;background:var(--ink-4);border:2px solid var(--ink-2);display:flex;align-items:center;justify-content:center;font:600 84px var(--mono)}
  .u span{font-size:24px;color:var(--muted)}
  #cta{left:50%;top:1400px;width:420px;margin-left:-210px;height:100px;font-size:40px}
</style></head><body>
<div id="stage">
  <div class="abs cx h-l" id="q" style="top:370px">عرض <span class="gl">خاص</span></div>
  <div class="abs" id="gift"></div>
  <div class="abs card" id="card"><div class="t" id="ct"></div><div class="o" id="co"></div><div class="n" id="cn"></div></div>
  <div class="abs" id="cd"></div>
  <div class="abs btn" id="cta"></div>
</div>
<script src="engine.js"></script>
<script>
const {K, inOut, pop, fade, say, cue, hook, icon, $, $$, E} = S;
// EDIT: offer details and how long is left when the video starts
const OFFER = {title: 'LAUNCH OFFER · عرض الإطلاق', offer: 'خصم <span class="g">١٥٪</span><br>على أول موقع', note: 'للطلبات المؤكدة خلال مدة العرض', cta: 'احجز مكانك', left: {d: 6, h: 23, m: 59, s: 59}};
S.setup({day: 28, dur: 14.2, mood: 'drive', end: {cta: OFFER.cta, line: 'العرض لفترة محدودة — <b>راسلنا الحين.</b>'}});
$('#gift').innerHTML = icon('gift', 72, '#14201B', 2);
$('#ct').textContent = OFFER.title; $('#co').innerHTML = OFFER.offer; $('#cn').textContent = OFFER.note; $('#cta').textContent = OFFER.cta;
$('#cd').innerHTML = [['d', 'يوم'], ['h', 'ساعة'], ['m', 'دقيقة'], ['s', 'ثانية']].map(([k, l]) => `<div class="u" id="u${k}"><b id="${k}">00</b><span>${l}</span></div>`).join('');

say('#q', .2, 11.1, {st: .14}); cue(.2, 'swish');
pop('#gift', .6, 11.1); cue(.6, 'pop');
K($('#gift svg'), [[1.0, {transform: 'rotate(0deg)'}], ...[...Array(6)].map((_, k) => [1.1 + k * .08, {transform: `rotate(${k % 2 ? 12 : -12}deg)`}, E.LIN]), [1.6, {transform: 'rotate(0deg)'}]]);
inOut('#card', 1.0, 11.1, {dy: 80}); cue(1.0, 'whoosh');
$$('#card > *').forEach((c, i) => inOut(c, 1.3 + i * .25, null, {dy: 30}));
cue(1.55, 'cash');
// live countdown: ticks down one second per second
const total0 = ((OFFER.left.d * 24 + OFFER.left.h) * 60 + OFFER.left.m) * 60 + OFFER.left.s;
const p2 = n => String(n).padStart(2, '0');
hook(t => { const r = total0 - Math.max(0, Math.floor(t - 2.2)); $('#d').textContent = p2(Math.floor(r / 86400)); $('#h').textContent = p2(Math.floor(r / 3600) % 24); $('#m').textContent = p2(Math.floor(r / 60) % 60); $('#s').textContent = p2(r % 60); });
$$('.u').forEach((u, i) => pop(u, 2.0 + i * .12, 11.1, {s: .6}));
for (let k = 0; k < 9; k++) { cue(3.2 + k, 'tick', {v: 1.2}); K('#s', [[3.2 + k - .01, {transform: 'translateY(0)'}], [3.2 + k, {transform: 'translateY(-6px)'}], [3.35 + k, {transform: 'translateY(0)'}]], {add: true}); }
pop('#cta', 3.6, 11.1); cue(3.6, 'pop', {f: 700});
K('#cta', [...Array(6)].map((_, k) => [5 + k * .9, {boxShadow: k % 2 ? '0 0 0 26px rgba(95,168,138,0)' : '0 0 0 0 rgba(95,168,138,.5)'}, k % 2 ? 'steps(1,end)' : E.OUT]));
S.start();
</script></body></html>
