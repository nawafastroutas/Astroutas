<div class="splash int" id="splash" role="status" aria-live="polite"
     aria-label="{{aria}}" data-splash>

  <div class="int__grid" aria-hidden="true"></div>

  <div class="int__core">
    <!-- شعار النادي — استبدل هذا الـ SVG بشعاركم الرسمي -->
    <div class="int__globe">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path class="int__route" d="M12 64Q50 2 88 38"/>
        <path class="int__route int__route--2" d="M16 36Q52 98 86 60"/>

        <circle class="int__sphere" cx="50" cy="50" r="40"/>

        <ellipse class="int__lat" cx="50" cy="32" rx="32" ry="6"/>
        <ellipse class="int__lat" cx="50" cy="50" rx="40" ry="8"/>
        <ellipse class="int__lat" cx="50" cy="68" rx="32" ry="6"/>

        <ellipse class="int__lon int__lon--1" cx="50" cy="50" rx="40" ry="40"/>
        <ellipse class="int__lon int__lon--2" cx="50" cy="50" rx="26" ry="40"/>
        <ellipse class="int__lon int__lon--3" cx="50" cy="50" rx="13" ry="40"/>
        <ellipse class="int__lon int__lon--4" cx="50" cy="50" rx="34" ry="40"/>

        <circle class="int__city" cx="38" cy="40" r="2"/>
        <circle class="int__city int__city--2" cx="62" cy="58" r="2"/>
        <circle class="int__city int__city--3" cx="56" cy="34" r="2"/>
      </svg>
    </div>

    <div>
      <h1 class="int__title">{{name}}</h1>
      <p class="int__tagline">{{tagline}}</p>
      <div class="int__hello" aria-hidden="true">
        <ul>
          <li>أهلًا وسهلًا</li>
          <li>Welcome</li>
          <li>Bienvenue</li>
          <li>Bienvenido</li>
          <li>أهلًا وسهلًا</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="int__journey">
    <div class="int__track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="0" aria-label="نسبة التحميل" data-splash-progress>
      <span class="int__flown"></span>
      <svg class="int__plane" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path d="M18 3 2 9.6l6.6 1.9L18 3Z"/>
        <path d="M8.6 11.5 18 3l-7.4 14-2-5.5Z" opacity=".7"/>
      </svg>
    </div>
    <div class="int__meta">
      <span data-splash-status>{{loading}}</span>
      <span class="int__pct"><b data-splash-percent>0</b>٪</span>
    </div>
  </div>
</div>
