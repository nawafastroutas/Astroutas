<div class="splash cul" id="splash" role="status" aria-live="polite"
     aria-label="{{aria}}" data-splash>

  <div class="cul__paper" aria-hidden="true"></div>

  <div class="cul__stage">
    <div class="cul__frame">
      <span class="cul__corner cul__corner--tr" aria-hidden="true"></span>
      <span class="cul__corner cul__corner--tl" aria-hidden="true"></span>
      <span class="cul__corner cul__corner--br" aria-hidden="true"></span>
      <span class="cul__corner cul__corner--bl" aria-hidden="true"></span>

      <!-- شعار النادي — استبدل هذا الـ SVG بشعاركم الرسمي -->
      <div class="cul__book" aria-hidden="true">
        <span class="cul__leaf cul__leaf--1"></span>
        <span class="cul__leaf cul__leaf--2"></span>
        <span class="cul__leaf cul__leaf--3"></span>
        <svg class="cul__mark" viewBox="0 0 64 64" fill="none">
          <path d="M32 6.5 34.6 10 32 13.5 29.4 10Z" fill="currentColor"/>
          <path d="M32 18v34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M32 18c-4.6-3.4-10.4-4.6-17-3.6a2 2 0 0 0-1.7 2v29.3a2 2 0 0 0 2.3 2c6-.9 11.4.3 16.4 3.5"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M32 18c4.6-3.4 10.4-4.6 17-3.6a2 2 0 0 1 1.7 2v29.3a2 2 0 0 1-2.3 2c-6-.9-11.4.3-16.4 3.5"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>

      <p class="cul__eyebrow">الأنشطة الطلابية</p>
      <h1 class="cul__title">{{name}}</h1>

      <div class="cul__rule" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="نسبة التحميل" data-splash-progress>
        <span class="cul__ink" data-splash-fill></span>
      </div>

      <p class="cul__tagline">{{tagline}}</p>
    </div>
  </div>

  <div class="cul__foot">
    <span data-splash-status>{{loading}}</span>
    <span class="cul__pct"><b data-splash-percent>0</b><i>٪</i></span>
  </div>
</div>
